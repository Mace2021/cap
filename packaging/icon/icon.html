<!doctype html>
<html><head><meta charset="utf-8"><title>C.A.P. app icon</title>
<style>
  /* Rendered at 1024 x 1024 on a transparent background; build_icons.py makes every size from it. */
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: transparent; }
  body { display: grid; place-items: center; font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; }
  .tile { width: 1024px; height: 1024px; border-radius: 224px; background: linear-gradient(155deg, #4fc196 0%, #23825f 100%);
          display: grid; place-items: center; position: relative; }
  .c { font-size: 760px; font-weight: 800; color: #0d1814; line-height: 1; transform: translateY(-24px); letter-spacing: -12px; }
  .dot { position: absolute; right: 150px; top: 196px; width: 124px; height: 124px; border-radius: 50%; background: #0d1814; }
  .dot::after { content: ""; position: absolute; inset: 35px; border-radius: 50%; background: #f2b93b; }
</style></head>
<body><div class="tile"><span class="c">C</span><span class="dot"></span></div></body></html>
