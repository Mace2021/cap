# Builds C.A.P. on Windows, macOS (Apple silicon) and Linux, starts each packaged app with --selftest, and on a
# version tag (v2.2.0, ...) publishes a GitHub release with every download and a SHA256SUMS.txt, then redeploys the site.
#
#   git tag v2.2.0 && git push origin v2.2.0
#
# "Run workflow" on the Actions tab builds and self-tests everything without publishing.
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Optional: your Azure app registration ID, saved as a repository secret, turns on Outlook / Microsoft 365 sign-in.
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      # The MSIX package's identity from Partner Center (Product identity), saved as repository variables.
      CAP_MSIX_NAME: ${{ vars.CAP_MSIX_NAME }}
      CAP_MSIX_PUBLISHER: ${{ vars.CAP_MSIX_PUBLISHER }}
      CAP_MSIX_PUBLISHER_NAME: ${{ vars.CAP_MSIX_PUBLISHER_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: System libraries for the Linux app window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          # Linux draws the window with Qt, which installs from pip; Windows uses Edge WebView2 and macOS uses WebKit.
          if [ "$RUNNER_OS" = "Linux" ]; then pip install "pywebview[qt]==5.3.2"; fi

      - name: Tests
        run: python -m pytest -q tests

      - name: Microsoft sign-in ID
        if: env.MS_CLIENT_ID != ''
        shell: bash
        run: |
          printf '{"microsoft_client_id": "%s"}\n' "$MS_CLIENT_ID" > cap_config.json

      - name: Inno Setup for the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build
        env:
          # Optional repository variable: the publisher name on your code-signing certificate.
          CAP_PUBLISHER: ${{ vars.CAP_PUBLISHER }}
        run: python build.py

      - name: Self-test the packaged app
        shell: bash
        timeout-minutes: 5
        env:
          CAP_DATA_DIR: ${{ runner.temp }}/cap-selftest
        run: |
          case "$RUNNER_OS" in
            Windows) pwsh -NoProfile -Command '$p = Start-Process dist/CAP/CAP.exe -ArgumentList "--selftest" -Wait -PassThru; exit $p.ExitCode' ;;
            macOS)   dist/CAP.app/Contents/MacOS/CAP --selftest ;;
            Linux)   QT_QPA_PLATFORM=offscreen dist/CAP/CAP --selftest ;;
          esac
          echo "Self-test passed on $RUNNER_OS"

      - name: Test the Windows installer (silent install, self-test, silent uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        env:
          CAP_DATA_DIR: ${{ runner.temp }}/cap-installer-test
        run: |
          $setup = Get-ChildItem dist/CAP-*-setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent install failed: $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\CAP\CAP.exe"
          $t = Start-Process $app -ArgumentList "--selftest" -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "Installed app self-test failed: $($t.ExitCode)" }
          $u = Start-Process "$env:LOCALAPPDATA\Programs\CAP\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Silent uninstall failed: $($u.ExitCode)" }
          Start-Sleep 3
          if (Test-Path $app) { throw "Uninstall left the app behind" }
          "Installer passed: install, self-test, uninstall"

      - name: Test the MSIX package (install a test-signed copy, self-test inside it, remove)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          # The Store signs the real package; a copy signed with a throwaway certificate proves it installs and runs.
          $msix = Get-ChildItem dist/CAP-*-store-x64.msix | Select-Object -First 1
          if (-not $msix) { throw "No MSIX package was built" }
          $publisher = if ($env:CAP_MSIX_PUBLISHER) { $env:CAP_MSIX_PUBLISHER } else { "CN=CAP Test Publisher" }
          $name = if ($env:CAP_MSIX_NAME) { $env:CAP_MSIX_NAME } else { "CAP.InboxAssistant" }
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName "CAP MSIX test" -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $test = Join-Path $env:RUNNER_TEMP "cap-test.msix"
          Copy-Item $msix.FullName $test
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint $test
          if ($LASTEXITCODE -ne 0) { throw "Signing the test copy failed" }
          $cer = Join-Path $env:RUNNER_TEMP "cap-test.cer"
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path $test
          $pkg = Get-AppxPackage -Name $name
          if (-not $pkg) { throw "The MSIX package didn't install" }
          "Installed $($pkg.PackageFullName)"
          $alias = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\cap-inbox.exe"
          $p = Start-Process $alias -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test inside the MSIX package failed: $($p.ExitCode)" }
          Remove-AppxPackage $pkg.PackageFullName
          "MSIX passed: install, self-test inside the package, remove"

      - uses: actions/upload-artifact@v4
        with:
          name: cap-${{ runner.os }}
          path: |
            dist/CAP-*-setup.exe
            dist/CAP-*-store-x64.msix
            dist/CAP-*.zip
            dist/CAP-*.tar.gz
            dist/CAP-*.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          cd out
          cat *.sha256 > SHA256SUMS.txt && rm *.sha256
          cat SHA256SUMS.txt
          cd ..
          version="${GITHUB_REF_NAME#v}"
          awk -v head="# C.A.P. ${version} " 'index($0, head) == 1 {on = 1; next} /^# C\.A\.P\. / {on = 0} on' CHANGELOG.md > notes.md
          {
            echo
            echo "## Download"
            echo "Windows: the windows-x64-setup.exe installer (or the portable windows ZIP) · Mac (Apple silicon): the macos ZIP · Linux: the linux tar.gz."
            echo "Setup steps: the Setup tab on the product site. Check your download against SHA256SUMS.txt."
            echo "These builds aren't code-signed yet, so Windows and macOS warn on first launch."
            echo "The store-x64.msix file is the package for Microsoft Store submission; it can't be installed directly."
          } >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "C.A.P. ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag

  site:
    # GitHub Pages only deploys from main, so start the site workflow there rather than from this tag.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Refresh the product site with the new downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
