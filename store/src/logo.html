<!doctype html>
<html><head><meta charset="utf-8"><title>C.A.P. Store logo</title>
<style>
  html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; }
  body { display: grid; place-items: center; background: #0f1418; font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; }
  .tile { width: 760px; height: 760px; border-radius: 170px; background: linear-gradient(155deg, #4fc196 0%, #23825f 100%);
          display: grid; place-items: center; box-shadow: 0 30px 80px rgba(0, 0, 0, .45); position: relative; }
  .c { font-size: 560px; font-weight: 800; color: #0d1814; line-height: 1; transform: translateY(-18px); letter-spacing: -10px; }
  .spark { position: absolute; right: 120px; top: 150px; width: 92px; height: 92px; border-radius: 50%; background: #0d1814; }
  .spark::after { content: ""; position: absolute; inset: 26px; border-radius: 50%; background: #f2b93b; }
</style></head>
<body><div class="tile"><span class="c">C</span><span class="spark"></span></div></body></html>
