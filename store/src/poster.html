<!doctype html>
<html><head><meta charset="utf-8"><title>C.A.P. Store poster</title>
<style>
  html, body { margin: 0; width: 1440px; height: 2160px; overflow: hidden; }
  body { background: radial-gradient(120% 70% at 50% 0%, #1d3a30 0%, #0f1418 60%); color: #e8eeeb;
         font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; display: flex; flex-direction: column; align-items: center; }
  .mark { margin-top: 230px; width: 300px; height: 300px; border-radius: 68px; background: linear-gradient(155deg, #4fc196, #23825f);
          display: grid; place-items: center; position: relative; box-shadow: 0 24px 60px rgba(0, 0, 0, .5); }
  .mark b { font-size: 220px; font-weight: 800; color: #0d1814; line-height: 1; transform: translateY(-8px); }
  .mark i { position: absolute; right: 46px; top: 58px; width: 36px; height: 36px; border-radius: 50%; background: #0d1814; }
  .mark i::after { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: #f2b93b; }
  h1 { font-size: 150px; font-weight: 800; margin: 90px 0 0; letter-spacing: -2px; }
  .sub { font-size: 56px; color: #4fc196; font-weight: 600; margin: 10px 0 0; }
  .tag { font-size: 64px; line-height: 1.25; text-align: center; margin: 110px 120px 0; font-weight: 600; }
  .shot { margin-top: 120px; width: 1180px; border-radius: 28px; overflow: hidden; border: 3px solid #2a343a; box-shadow: 0 30px 80px rgba(0, 0, 0, .55); }
  .shot img { display: block; width: 100%; }
</style></head>
<body>
  <div class="mark"><b>C</b><i></i></div>
  <h1>C.A.P.</h1>
  <p class="sub">Inbox Assistant</p>
  <p class="tag">Your inbox, answered.<br>Privately, on your own PC.</p>
  <div class="shot"><img src="../../site/assets/inbox.png" alt=""></div>
</body></html>
